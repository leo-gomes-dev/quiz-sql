<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado Acadêmico: Segurança em SQL</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h1>⚡ Simulado de Fixação Paginado: SQL Injection</h1>
        <p>Responda as questões para validar seus conhecimentos acadêmicos.</p>
    </header>

    <main class="quiz-container">
        <!-- O JavaScript vai injetar os cards das perguntas aqui dentro -->
        <div id="quiz-dinamico"></div>

        <!-- Barra de Navegação de Páginas -->
        <div class="paginacao-controles">
            <button id="btnAnterior" class="btn-secundario" disabled>Anterior</button>
            <span id="indicadorPagina">Página 1 de 2</span>
            <button id="btnProximo" class="btn-secundario">Próximo</button>
        </div>

        <button id="btnVerificar" class="btn-principal hidden">Corrigir Simulado</button>
        <div id="resultadoFinal" class="alerta hidden"></div>
    </main>

    <script src="./app.js"></script>
</body>
</html>
